<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Minecraft知识问答</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Minecraft知识问答</h1>
        <div class="question-container">
            <p class="question"></p>
        </div>
        <div class="options">
            <div class="option" data-option="a"><span class="option-label">A</span><span class="a"></span></div>
            <div class="option" data-option="b"><span class="option-label">B</span><span class="b"></span></div>
            <div class="option" data-option="c"><span class="option-label">C</span><span class="c"></span></div>
            <div class="option" data-option="d"><span class="option-label">D</span><span class="d"></span></div>
        </div>
        <div>
            <p><span class="from"></span></p>
            <p><a href="#" class="reference" target="_blank"></a></p>
        </div>
        <div class="button-container">
            <button class="next-btn" id="nextBtn">下一题</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
